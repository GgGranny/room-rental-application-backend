spring.application.name=room_rental_application

## H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:roomrentaldb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true

## Postgres configuration

spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true

## Server Configuration
server.port=8000


spring.security.user.name=admin
spring.security.user.password=123

## logging configuration
logging.level.root=info

## Jwt configuration
spring.profiles.include=local
jwt.secret=${JWT_SECRET}
access.token.expiration = ${ACCESS_TOKEN_EXPIRATION}
refresh.token.expiration = ${REFRESH_TOKEN_EXPIRATION}


## SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


## OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

oauth2.login.success.url=http://localhost:3000/home
oauth2.login.failure.url=http://localhost:3000/login 


## File Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

## Custom folder path
file.kyc.folder=uploads/kyc_documents
