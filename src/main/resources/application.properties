## Postgres configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/roomrentaldb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql


## Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.private-bucket-name=${SUPABASE_PRIVATE_BUCKET_NAME}
supabase.public-bucket-name=${SUPABASE_PUBLIC_BUCKET_NAME}

## jpa configuration
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.query.startup_check=false
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

## Server Configuration
server.port=8000


spring.security.user.name=admin
spring.security.user.password=123

## logging configuration
logging.level.root=info

## Jwt configuration
spring.profiles.include=local
jwt.secret=${JWT_SECRET}
access.token.expiration = ${ACCESS_TOKEN_EXPIRATION}
refresh.token.expiration = ${REFRESH_TOKEN_EXPIRATION}


## SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


## OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

oauth2.login.success.url=http://localhost:3000/home
oauth2.login.failure.url=http://localhost:3000/login 


## File Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

## Custom folder path
file.kyc.folder=uploads/kyc_documents


## External Api Configs
city.and.country.location.baseUrl=https://countriesnow.space/api/v0.1/countries
