# spring.h2.console.enabled=true

## Postgres configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/roomrentaldb
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data.sql


## Supabase Configuration
supabase.url=${SUPABASE_URL}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.private-bucket-name=${SUPABASE_PRIVATE_BUCKET_NAME}
supabase.public-bucket-name=${SUPABASE_PUBLIC_BUCKET_NAME}

## jpa configuration
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.query.startup_check=false
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

## Server Configuration
server.port=8000


spring.security.user.name=admin
spring.security.user.password=123

## Seed admin account (AdminSeeder). Overridable via APP_ADMIN_EMAIL / APP_ADMIN_PASSWORD.
## Defaults are for local development only — change the password after first login.
app.admin.email=${APP_ADMIN_EMAIL:admin@example.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}
# Set true in HTTPS deployments so JWT cookies are sent only over TLS.
app.cookie.secure=${APP_COOKIE_SECURE:false}

## logging configuration
logging.level.root=info

## Jwt configuration
spring.profiles.include=local
jwt.secret=${JWT_SECRET}
access.token.expiration = ${ACCESS_TOKEN_EXPIRATION}
refresh.token.expiration = ${REFRESH_TOKEN_EXPIRATION}


## SMTP configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


## OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

oauth2.login.success.url=http://localhost:3000/home
oauth2.login.failure.url=http://localhost:3000/login 


## File Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB

## Custom folder path
file.kyc.folder=uploads/kyc_documents


## External Api Configs
city.and.country.location.baseUrl=https://countriesnow.space/api/v0.1/countries

## Firebase Cloud Messaging. Service-account file lives at the project root
## (firebase-service-account.json) and is gitignored. Override via FIREBASE_CREDENTIALS_PATH.
app.firebase.credentials-path=${FIREBASE_CREDENTIALS_PATH:firebase-service-account.json}

## Featured-listing payments (landlords pay to feature a property).
## Amount is in NPR; featuring lasts featured.days after a successful payment.
app.payment.featured.amount=${FEATURED_AMOUNT:500}
app.payment.featured.days=${FEATURED_DAYS:30}
## Where the gateway sends the browser back to (Next.js frontend).
app.payment.frontend.success-url=${PAYMENT_SUCCESS_URL:http://localhost:3000/landlord/payment/callback}
app.payment.frontend.failure-url=${PAYMENT_FAILURE_URL:http://localhost:3000/landlord/payment/failed}

## eSewa v2 (sandbox defaults; EPAYTEST + public test secret). Override in prod.
app.payment.esewa.merchant-code=${ESEWA_MERCHANT_CODE:EPAYTEST}
app.payment.esewa.secret=${ESEWA_SECRET:8gBm/:&EnhH.1/q}
app.payment.esewa.form-url=${ESEWA_FORM_URL:https://rc-epay.esewa.com.np/api/epay/main/v2/form}
app.payment.esewa.status-url=${ESEWA_STATUS_URL:https://rc.esewa.com.np/api/epay/transaction/status/}

